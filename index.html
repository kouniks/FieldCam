<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FieldCam v1 — Geo-Camera Field Validation</title>
  <meta property="og:title" content="FieldCam v1 — Geo-Camera Field Validation" />
  <meta property="og:description" content="Capture field validation photos with embedded satellite/street maps, GPS coordinates, and place names." />
  <meta property="og:image" content="https://kouniks.github.io/FieldCam/sample_capture.jpg" />
  <meta property="og:url" content="https://kouniks.github.io/FieldCam/" />
  <meta name="twitter:card" content="summary_large_image" />
  
  <!-- Leaflet CSS & JS for Live Viewfinder Mini-Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --panel-bg: rgba(15, 23, 42, 0.84);
      --accent: #10b981;
      --accent-hover: #059669;
      --warn: #f59e0b;
      --danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, monospace;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top Status Bar */
    .top-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.85), transparent);
      pointer-events: none;
    }

    .top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .top-bar > *, .top-row > * {
      pointer-events: auto;
    }

    .brand-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .gps-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--panel-bg);
      backdrop-filter: blur(8px);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }
    .dot.good { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .dot.warn { background: var(--warn); box-shadow: 0 0 8px var(--warn); }

    /* Mode Toggle Switch on Primary Screen */
    .mode-toggle-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .mode-toggle {
      display: inline-flex;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 3px;
      gap: 4px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #052e16;
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.4);
    }

    /* Main Camera Viewport */
    .viewport {
      position: relative;
      flex: 1;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    video#camera-stream {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Live Overlay HUD Preview */
    .hud-overlay {
      position: absolute;
      bottom: 90px;
      left: 10px;
      right: 10px;
      z-index: 15;
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 10px;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .mini-map-wrapper {
      position: relative;
      width: 108px;
      height: 108px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(16, 185, 129, 0.6);
    }

    #live-map {
      width: 100%;
      height: 100%;
    }

    .map-layer-toggle {
      position: absolute;
      bottom: 4px;
      right: 4px;
      z-index: 400;
      background: rgba(15, 23, 42, 0.88);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .telemetry-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 11px;
      line-height: 1.3;
      overflow: hidden;
      min-width: 0;
    }

    .telemetry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 3px;
      margin-bottom: 2px;
    }

    .plot-tag {
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .class-badge {
      background: rgba(16, 185, 129, 0.2);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.4);
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 9.5px;
      font-weight: 700;
      white-space: nowrap;
    }

    .place-row {
      color: #fde68a;
      font-weight: 600;
      font-size: 11px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .coord-row {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10.5px;
      color: #e2e8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-sub {
      color: var(--text-muted);
      font-size: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-highlight {
      color: #38bdf8;
      font-weight: 600;
    }

    /* Bottom Control Bar */
    .control-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid var(--border);
      z-index: 20;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 16px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text-main);
      width: 46px;
      height: 46px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      position: relative;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .btn-icon.hidden-mode {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.8);
    }

    .btn-shutter {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #fff;
      border: 4px solid var(--accent);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.5);
    }

    .btn-shutter:active {
      transform: scale(0.92);
    }

    .btn-shutter-inner {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
    }

    .badge-count {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--accent);
      color: #000;
      font-size: 10px;
      font-weight: 800;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modals / Drawers */
    .drawer {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.97);
      display: none;
      flex-direction: column;
      padding: 18px;
      overflow-y: auto;
    }

    .drawer.open {
      display: flex;
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .drawer-header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .btn-close {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      font-size: 14px;
    }

    /* Gallery Grid */
    .gallery-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn-action {
      flex: 1;
      background: var(--accent);
      color: #052e16;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-action.secondary {
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      border: 1px solid var(--border);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
    }

    .photo-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .photo-card img {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      background: #000;
    }

    .photo-card-footer {
      padding: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .photo-card-footer a {
      background: var(--accent);
      color: #000;
      text-decoration: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 11px;
    }

    /* Flash Effect */
    .flash-overlay {
      position: fixed;
      inset: 0;
      background: #fff;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
    }
    .flash-overlay.active {
      opacity: 0.85;
    }

    .leaflet-control-attribution, .leaflet-control-zoom {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="flash-overlay" id="flash"></div>

  <!-- Top Bar with Primary Mode Toggle -->
  <div class="top-bar">
    <div class="top-row">
      <div class="brand-badge">
        <span>🛰️ FieldCam v1</span>
      </div>
      <div class="gps-pill" id="gps-pill">
        <span class="dot" id="gps-dot"></span>
        <span id="gps-status-text">Acquiring GPS...</span>
      </div>
    </div>

    <!-- Primary Screen Mode Toggle: Project Mode vs Default Mode -->
    <div class="mode-toggle-wrapper">
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-btn-project" type="button">Project Mode</button>
        <button class="mode-btn" id="mode-btn-default" type="button">Default Mode</button>
      </div>
    </div>
  </div>

  <!-- Main Camera Viewfinder -->
  <div class="viewport">
    <video id="camera-stream" autoplay playsinline muted></video>

    <!-- Live Field HUD Preview -->
    <div class="hud-overlay">
      <div class="mini-map-wrapper">
        <div id="live-map"></div>
        <button class="map-layer-toggle" id="btn-layer-toggle" title="Switch Map Layer">SAT</button>
      </div>

      <div class="telemetry-info">
        <div class="telemetry-header">
          <span class="plot-tag" id="hud-plot">PLOT-001</span>
          <span class="class-badge" id="hud-class">Built-up / Urban</span>
        </div>
        <div class="place-row" id="hud-place">📍 Detecting location name...</div>
        <div class="coord-row" id="hud-latlon">Lat: --.------ | Lon: --.------</div>
        <div class="coord-row" id="hud-alt-acc">Alt: -- m | Acc: ±-- m</div>
        <div class="meta-sub" id="hud-notes">Notes: Field-validation</div>
        <div class="meta-sub day-highlight" id="hud-time">📅 --</div>
      </div>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="control-bar">
    <button class="btn-icon" id="btn-open-meta" title="Edit Field Metadata">
      📝
    </button>

    <button class="btn-icon" id="btn-flip-cam" title="Switch Camera">
      🔄
    </button>

    <button class="btn-shutter" id="btn-capture" title="Capture Geo-Stamped Photo">
      <div class="btn-shutter-inner"></div>
    </button>

    <button class="btn-icon" id="btn-open-gallery" title="Captured Log & Export">
      🗂️
      <span class="badge-count" id="capture-count">0</span>
    </button>
  </div>

  <!-- Metadata Configuration Drawer (Used in Project Mode) -->
  <div class="drawer" id="drawer-meta">
    <div class="drawer-header">
      <h2>FieldCam v1 — Project Metadata</h2>
      <button class="btn-close" id="btn-close-meta">Done</button>
    </div>

    <div class="form-group">
      <label>Project / Campaign Name</label>
      <input type="text" id="input-project" value="Field Validation" />
    </div>

    <div class="form-group">
      <label>Sample / Plot ID (Auto-increments on capture)</label>
      <input type="text" id="input-plot" value="PLOT-001" />
    </div>

    <div class="form-group">
      <label>Validation Class / Land Cover Category</label>
      <select id="input-class">
        <option value="Built-up / Urban" selected>Built-up / Urban</option>
        <option value="Cropland">Cropland / Agriculture</option>
        <option value="Forest / Vegetation">Forest / Dense Vegetation</option>
        <option value="Fallow / Barren">Fallow / Barren Land</option>
        <option value="Waterbody / Wetland">Waterbody / Reservoir</option>
        <option value="Mangrove / Coastal">Mangrove / Coastal</option>
        <option value="Other">Other (See Notes)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Place Name (Auto-detected from GPS, or type custom override)</label>
      <input type="text" id="input-place-override" placeholder="Leave blank to use live GPS place name" />
    </div>

    <div class="form-group">
      <label>Embedded Map Zoom Level</label>
      <select id="input-zoom">
        <option value="15">Zoom 15 (Neighborhood / ~500m)</option>
        <option value="16">Zoom 16 (Sub-sector / ~250m)</option>
        <option value="17">Zoom 17 (Field Plot / ~100m)</option>
        <option value="18" selected>Zoom 18 (Micro-plot / ~50m)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Field Observer Notes</label>
      <textarea id="input-notes" rows="2">Field-validation</textarea>
    </div>
  </div>

  <!-- Session Gallery & GIS Export Drawer -->
  <div class="drawer" id="drawer-gallery">
    <div class="drawer-header">
      <h2>Captured Validation Log</h2>
      <button class="btn-close" id="btn-close-gallery">Close</button>
    </div>

    <div class="gallery-actions">
      <button class="btn-action" id="btn-export-csv">⬇️ Export CSV (QGIS)</button>
      <button class="btn-action secondary" id="btn-export-geojson">⬇️ Export GeoJSON</button>
    </div>

    <div class="gallery-grid" id="gallery-container"></div>
  </div>

  <script>
    /**************************************************************
     * 1. STATE & CONFIGURATION
     **************************************************************/
    const state = {
      mode: "project", // 'project' or 'default'
      lat: null,
      lon: null,
      accuracy: null,
      altitude: null,
      placeName: "Acquiring location name...",
      lastGeocodeLat: null,
      lastGeocodeLon: null,
      lastGeocodeTime: 0,
      facingMode: "environment",
      mapLayer: "satellite",
      captures: [],
      stream: null
    };

    const TILE_SERVERS = {
      satellite: {
        name: "SAT",
        url: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`,
        leafletUrl: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      },
      osm: {
        name: "OSM",
        url: (z, x, y) => `https://tile.openstreetmap.org/${z}/${x}/${y}.png`,
        leafletUrl: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      }
    };

    /**************************************************************
     * 2. DATE & DAY-OF-WEEK FORMATTER
     **************************************************************/
    function getFormattedDayAndDate(dateObj) {
      const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      const dayName = days[dateObj.getDay()];
      const dd = String(dateObj.getDate()).padStart(2, "0");
      const mm = String(dateObj.getMonth() + 1).padStart(2, "0");
      const yyyy = dateObj.getFullYear();
      const hh = String(dateObj.getHours()).padStart(2, "0");
      const min = String(dateObj.getMinutes()).padStart(2, "0");
      const ss = String(dateObj.getSeconds()).padStart(2, "0");
      return {
        dayName,
        localFormatted: `${dayName}, ${dd}/${mm}/${yyyy}, ${hh}:${min}:${ss}`,
        utcFormatted: dateObj.toISOString().replace("T", " ").slice(0, 19) + " UTC"
      };
    }

    /**************************************************************
     * 3. MODE SWITCHING (PROJECT MODE VS DEFAULT MODE)
     **************************************************************/
    function setAppMode(newMode) {
      state.mode = newMode;
      const btnProject = document.getElementById("mode-btn-project");
      const btnDefault = document.getElementById("mode-btn-default");
      const btnMeta = document.getElementById("btn-open-meta");
      const hudNotes = document.getElementById("hud-notes");

      if (newMode === "project") {
        btnProject.classList.add("active");
        btnDefault.classList.remove("active");
        btnMeta.classList.remove("hidden-mode");
        hudNotes.style.display = "block";
      } else {
        btnDefault.classList.add("active");
        btnProject.classList.remove("active");
        // Hide metadata button in Default Mode since it uses automatic preset
        btnMeta.classList.add("hidden-mode");
        hudNotes.style.display = "none";
      }
      syncHudLabels();
    }

    document.getElementById("mode-btn-project").addEventListener("click", () => setAppMode("project"));
    document.getElementById("mode-btn-default").addEventListener("click", () => setAppMode("default"));

    /**************************************************************
     * 4. LIVE LEAFLET PREVIEW MAP
     **************************************************************/
    const map = L.map("live-map", {
      zoomControl: false,
      attributionControl: false,
      dragging: false,
      scrollWheelZoom: false,
      doubleClickZoom: false
    }).setView([19.1340, 72.9051], 18);

    let currentTileLayer = L.tileLayer(TILE_SERVERS.satellite.leafletUrl, {
      crossOrigin: true
    }).addTo(map);

    const posMarker = L.circleMarker([19.1340, 72.9051], {
      radius: 6,
      fillColor: "#10b981",
      color: "#ffffff",
      weight: 2,
      fillOpacity: 1
    }).addTo(map);

    document.getElementById("btn-layer-toggle").addEventListener("click", () => {
      state.mapLayer = state.mapLayer === "satellite" ? "osm" : "satellite";
      const cfg = TILE_SERVERS[state.mapLayer];
      document.getElementById("btn-layer-toggle").textContent = cfg.name;
      map.removeLayer(currentTileLayer);
      currentTileLayer = L.tileLayer(cfg.leafletUrl, { crossOrigin: true }).addTo(map);
    });

    /**************************************************************
     * 5. CAMERA ENGINE
     **************************************************************/
    async function initCamera() {
      if (state.stream) {
        state.stream.getTracks().forEach(t => t.stop());
      }
      try {
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: state.facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          }
        };
        state.stream = await navigator.mediaDevices.getUserMedia(constraints);
        const videoEl = document.getElementById("camera-stream");
        videoEl.srcObject = state.stream;
      } catch (err) {
        alert("Camera access failed. Ensure you are using HTTPS and have granted camera permissions.\n\nError: " + err.message);
      }
    }

    document.getElementById("btn-flip-cam").addEventListener("click", () => {
      state.facingMode = state.facingMode === "environment" ? "user" : "environment";
      initCamera();
    });

    /**************************************************************
     * 6. REVERSE GEOCODING (PLACE NAME FROM GPS)
     **************************************************************/
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      if (lat1 === null || lat2 === null) return Infinity;
      const R = 6371000;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos((lat1 * Math.PI) / 180) *
          Math.cos((lat2 * Math.PI) / 180) *
          Math.sin(dLon / 2) *
          Math.sin(dLon / 2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function getActivePlaceName() {
      if (state.mode === "project") {
        const override = document.getElementById("input-place-override").value.trim();
        if (override) return override;
      }
      return state.placeName;
    }

    async function updatePlaceName(lat, lon) {
      const now = Date.now();
      const movedDist = getDistanceMeters(state.lastGeocodeLat, state.lastGeocodeLon, lat, lon);

      if (movedDist < 25 && now - state.lastGeocodeTime < 15000) return;

      state.lastGeocodeLat = lat;
      state.lastGeocodeLon = lon;
      state.lastGeocodeTime = now;

      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lon}&zoom=18&addressdetails=1`,
          { headers: { "Accept-Language": "en" } }
        );
        if (res.ok) {
          const data = await res.json();
          const addr = data.address || {};
          const parts = [
            addr.amenity || addr.building || addr.road || addr.neighbourhood,
            addr.suburb || addr.village || addr.town || addr.city_district,
            addr.city || addr.county || addr.state_district,
            addr.state
          ].filter(Boolean);

          const uniqueParts = [...new Set(parts)];
          if (uniqueParts.length > 0) {
            state.placeName = uniqueParts.join(", ");
          } else if (data.display_name) {
            state.placeName = data.display_name.split(",").slice(0, 4).map(s => s.trim()).join(", ");
          }
          document.getElementById("hud-place").textContent = "📍 " + getActivePlaceName();
          return;
        }
      } catch (e) {
        console.warn("Nominatim lookup failed, trying fallback...", e);
      }

      try {
        const res2 = await fetch(
          `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`
        );
        if (res2.ok) {
          const d2 = await res2.json();
          const parts2 = [d2.locality, d2.city, d2.principalSubdivision].filter(Boolean);
          const unique2 = [...new Set(parts2)];
          if (unique2.length > 0) {
            state.placeName = unique2.join(", ");
            document.getElementById("hud-place").textContent = "📍 " + getActivePlaceName();
          }
        }
      } catch (err) {
        console.warn("Fallback reverse geocoding failed:", err);
      }
    }

    /**************************************************************
     * 7. HIGH-ACCURACY GEOLOCATION ENGINE
     **************************************************************/
    function toDMS(deg, isLat) {
      const absolute = Math.abs(deg);
      const d = Math.floor(absolute);
      const minNotTruncated = (absolute - d) * 60;
      const m = Math.floor(minNotTruncated);
      const s = ((minNotTruncated - m) * 60).toFixed(2);
      const dir = isLat ? (deg >= 0 ? "N" : "S") : (deg >= 0 ? "E" : "W");
      return `${d}°${m}'${s}"${dir}`;
    }

    function initGeolocation() {
      if (!("geolocation" in navigator)) {
        document.getElementById("gps-status-text").textContent = "GPS Unsupported";
        return;
      }

      navigator.geolocation.watchPosition(
        (pos) => {
          state.lat = pos.coords.latitude;
          state.lon = pos.coords.longitude;
          state.accuracy = pos.coords.accuracy;
          state.altitude = pos.coords.altitude;

          const dot = document.getElementById("gps-dot");
          const statusText = document.getElementById("gps-status-text");
          const acc = Math.round(state.accuracy);

          dot.className = "dot " + (acc <= 12 ? "good" : acc <= 30 ? "warn" : "");
          statusText.textContent = `GPS Lock (±${acc}m)`;

          document.getElementById("hud-latlon").textContent =
            `Lat: ${state.lat.toFixed(6)}° | Lon: ${state.lon.toFixed(6)}°`;
          const altStr = state.altitude !== null ? `${Math.round(state.altitude)}m` : "N/A";
          document.getElementById("hud-alt-acc").textContent =
            `Alt: ${altStr} | Acc: ±${acc}m`;

          const zoom = state.mode === "project"
            ? parseInt(document.getElementById("input-zoom").value, 10)
            : 18;
          map.setView([state.lat, state.lon], zoom);
          posMarker.setLatLng([state.lat, state.lon]);

          updatePlaceName(state.lat, state.lon);
        },
        (err) => {
          document.getElementById("gps-status-text").textContent = "GPS Signal Lost";
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 15000
        }
      );
    }

    // Live clock update showing Day of Week + Date + Time
    function updateLiveClock() {
      const now = new Date();
      const { localFormatted, utcFormatted } = getFormattedDayAndDate(now);
      document.getElementById("hud-time").textContent =
        `📅 ${localFormatted} (${utcFormatted.slice(11)})`;
    }
    setInterval(updateLiveClock, 1000);

    /**************************************************************
     * 8. SLIPPY MAP TILE COMPOSITOR FOR CANVAS WATERMARKING
     **************************************************************/
    function latLonToTileXY(lat, lon, zoom) {
      const n = Math.pow(2, zoom);
      const xFloat = ((lon + 180) / 360) * n;
      const latRad = (lat * Math.PI) / 180;
      const yFloat =
        ((1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2) * n;
      return {
        tileX: Math.floor(xFloat),
        tileY: Math.floor(yFloat),
        offsetX: Math.floor((xFloat - Math.floor(xFloat)) * 256),
        offsetY: Math.floor((yFloat - Math.floor(yFloat)) * 256)
      };
    }

    function loadTileImage(url) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = url;
      });
    }

    async function renderEmbeddedMapCanvas(lat, lon, zoom, layerType, boxSize) {
      const mapCanvas = document.createElement("canvas");
      mapCanvas.width = boxSize;
      mapCanvas.height = boxSize;
      const ctx = mapCanvas.getContext("2d");

      ctx.fillStyle = "#0f172a";
      ctx.fillRect(0, 0, boxSize, boxSize);

      if (lat !== null && lon !== null) {
        const { tileX, tileY, offsetX, offsetY } = latLonToTileXY(lat, lon, zoom);
        const centerCanvasX = boxSize / 2;
        const centerCanvasY = boxSize / 2;
        const urlBuilder = TILE_SERVERS[layerType].url;

        const promises = [];
        for (let dx = -1; dx <= 1; dx++) {
          for (let dy = -1; dy <= 1; dy++) {
            const url = urlBuilder(zoom, tileX + dx, tileY + dy);
            promises.push(loadTileImage(url).then((img) => ({ img, dx, dy })));
          }
        }

        const tiles = await Promise.all(promises);
        tiles.forEach(({ img, dx, dy }) => {
          if (img) {
            const drawX = centerCanvasX - offsetX + dx * 256;
            const drawY = centerCanvasY - offsetY + dy * 256;
            ctx.drawImage(img, drawX, drawY, 256, 256);
          }
        });
      }

      ctx.strokeStyle = "rgba(255, 255, 255, 0.25)";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(boxSize / 2, 0);
      ctx.lineTo(boxSize / 2, boxSize);
      ctx.moveTo(0, boxSize / 2);
      ctx.lineTo(boxSize, boxSize / 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(boxSize / 2, boxSize / 2, boxSize * 0.11, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(16, 185, 129, 0.28)";
      ctx.fill();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = "#10b981";
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(boxSize / 2, boxSize / 2, Math.max(4, boxSize * 0.032), 0, Math.PI * 2);
      ctx.fillStyle = "#10b981";
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#ffffff";
      ctx.stroke();

      const badgeH = Math.max(18, Math.round(boxSize * 0.12));
      const badgeW = Math.max(24, Math.round(boxSize * 0.15));
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(boxSize - badgeW - 6, 6, badgeW, badgeH);
      ctx.fillStyle = "#ffffff";
      ctx.font = `bold ${Math.max(10, Math.round(boxSize * 0.065))}px sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText("▲N", boxSize - badgeW / 2 - 6, 6 + badgeH * 0.74);

      const zW = Math.max(54, Math.round(boxSize * 0.34));
      ctx.fillStyle = "rgba(15, 23, 42, 0.85)";
      ctx.fillRect(6, boxSize - badgeH - 6, zW, badgeH);
      ctx.fillStyle = "#cbd5e1";
      ctx.font = `bold ${Math.max(9, Math.round(boxSize * 0.058))}px monospace`;
      ctx.textAlign = "left";
      ctx.fillText(`${TILE_SERVERS[layerType].name} Z${zoom}`, 10, boxSize - 6 - badgeH * 0.28);

      return mapCanvas;
    }

    /**************************************************************
     * 9. PORTRAIT-SAFE CANVAS TEXT FITTER & CAPTURE PIPELINE
     **************************************************************/
    function roundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function drawFittedLine(ctx, text, x, y, maxWidth, baseSize, fontFamily, fontWeight, color) {
      let fontSize = baseSize;
      ctx.fillStyle = color;
      ctx.textAlign = "left";
      while (fontSize > 8) {
        ctx.font = `${fontWeight} ${fontSize}px ${fontFamily}`;
        if (ctx.measureText(text).width <= maxWidth) break;
        fontSize -= 0.5;
      }
      ctx.fillText(text, x, y);
    }

    function autoIncrementPlotId(plotStr) {
      return plotStr.replace(/(\d+)$/, (match) => {
        const num = parseInt(match, 10) + 1;
        return String(num).padStart(match.length, "0");
      });
    }

    document.getElementById("btn-capture").addEventListener("click", async () => {
      const video = document.getElementById("camera-stream");
      if (!video.videoWidth) return;

      const flash = document.getElementById("flash");
      flash.classList.add("active");
      setTimeout(() => flash.classList.remove("active"), 160);

      const width = video.videoWidth;
      const height = video.videoHeight;

      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");

      // 1. Draw full-resolution camera frame
      ctx.drawImage(video, 0, 0, width, height);

      // 2. Scale strictly by HORIZONTAL WIDTH so Portrait Mode never overflows
      const pad = Math.round(width * 0.022);
      const cardWidth = width - pad * 2;
      const cardHeight = Math.round(Math.min(height * 0.25, Math.max(width * 0.25, 175)));
      const cardY = height - cardHeight - pad;
      const innerPad = Math.round(cardHeight * 0.065);

      ctx.save();
      roundRect(ctx, pad, cardY, cardWidth, cardHeight, Math.round(cardHeight * 0.08));
      ctx.fillStyle = "rgba(15, 23, 42, 0.86)";
      ctx.fill();
      ctx.lineWidth = Math.max(1.5, width * 0.002);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.22)";
      ctx.stroke();
      ctx.restore();

      // 3. Render & draw square embedded map inset on left
      const mapSize = cardHeight - innerPad * 2;
      const mapX = pad + innerPad;
      const mapY = cardY + innerPad;
      const zoom = state.mode === "project"
        ? parseInt(document.getElementById("input-zoom").value, 10)
        : 18;

      const mapCanvas = await renderEmbeddedMapCanvas(
        state.lat,
        state.lon,
        zoom,
        state.mapLayer,
        mapSize
      );

      const mapRadius = Math.round(mapSize * 0.06);
      ctx.save();
      roundRect(ctx, mapX, mapY, mapSize, mapSize, mapRadius);
      ctx.clip();
      ctx.drawImage(mapCanvas, mapX, mapY, mapSize, mapSize);
      ctx.restore();

      ctx.save();
      roundRect(ctx, mapX, mapY, mapSize, mapSize, mapRadius);
      ctx.lineWidth = Math.max(1.5, width * 0.002);
      ctx.strokeStyle = "#10b981";
      ctx.stroke();
      ctx.restore();

      // 4. Prepare Common Telemetry Values
      const textX = mapX + mapSize + innerPad * 1.2;
      const maxTextWidth = (pad + cardWidth) - textX - innerPad;

      const placeName = getActivePlaceName();
      const now = new Date();
      const { dayName, localFormatted, utcFormatted } = getFormattedDayAndDate(now);

      const decStr = state.lat !== null && state.lon !== null
        ? `GPS: ${state.lat.toFixed(6)}° N, ${state.lon.toFixed(6)}° E`
        : "GPS: Coordinates Unacquired";

      const dmsStr = state.lat !== null && state.lon !== null
        ? `DMS: ${toDMS(state.lat, true)}  ${toDMS(state.lon, false)}`
        : "DMS: N/A";

      const altText = state.altitude !== null ? `${Math.round(state.altitude)}m ASL` : "N/A";
      const accText = state.accuracy !== null ? `±${Math.round(state.accuracy)}m` : "N/A";

      let plotId = "DEFAULT";
      let project = "Default Preset";
      let lulcClass = "Geo-Tag";
      let notes = "";

      if (state.mode === "project") {
        // PROJECT MODE: 7-Row Layout with Full Metadata
        project = document.getElementById("input-project").value.trim();
        plotId = document.getElementById("input-plot").value.trim();
        lulcClass = document.getElementById("input-class").value;
        notes = document.getElementById("input-notes").value.trim();

        const totalRows = 7;
        const rowStep = mapSize / totalRows;
        let rowY = mapY + rowStep * 0.78;

        // Row 1: Plot ID + Validation Class + App Name
        drawFittedLine(
          ctx,
          `${plotId} • ${lulcClass.toUpperCase()}   [FieldCam v1]`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.74),
          "sans-serif",
          "bold",
          "#10b981"
        );

        // Row 2: Place Name
        rowY += rowStep;
        drawFittedLine(
          ctx,
          `📍 ${placeName}`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.68),
          "sans-serif",
          "bold",
          "#fde68a"
        );

        // Row 3: Decimal Coordinates
        rowY += rowStep;
        drawFittedLine(
          ctx,
          decStr,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.68),
          "monospace",
          "bold",
          "#ffffff"
        );

        // Row 4: DMS Coordinates
        rowY += rowStep;
        drawFittedLine(
          ctx,
          dmsStr,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.64),
          "monospace",
          "normal",
          "#e2e8f0"
        );

        // Row 5: Altitude, Accuracy & Map Info
        rowY += rowStep;
        drawFittedLine(
          ctx,
          `Alt: ${altText}  |  Acc: ${accText}  |  Map: ${TILE_SERVERS[state.mapLayer].name} (Z${zoom})`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.64),
          "monospace",
          "normal",
          "#cbd5e1"
        );

        // Row 6: Project & Field Notes
        rowY += rowStep;
        drawFittedLine(
          ctx,
          `Project: ${project} — Notes: ${notes}`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.62),
          "sans-serif",
          "normal",
          "#cbd5e1"
        );

        // Row 7: Day of Week + Date + Local & UTC Timestamps
        rowY += rowStep;
        drawFittedLine(
          ctx,
          `📅 ${localFormatted}  |  UTC: ${utcFormatted}`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.60),
          "monospace",
          "bold",
          "#38bdf8"
        );
      } else {
        // DEFAULT MODE: Clean 6-Row Preset Layout (No custom metadata inputs)
        const totalRows = 6;
        const rowStep = mapSize / totalRows;
        let rowY = mapY + rowStep * 0.78;

        // Row 1: App Brand Header Preset
        drawFittedLine(
          ctx,
          `FieldCam v1  •  GEO-STAMP PRESET`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.72),
          "sans-serif",
          "bold",
          "#10b981"
        );

        // Row 2: Place Name
        rowY += rowStep;
        drawFittedLine(
          ctx,
          `📍 ${placeName}`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.66),
          "sans-serif",
          "bold",
          "#fde68a"
        );

        // Row 3: Decimal Coordinates
        rowY += rowStep;
        drawFittedLine(
          ctx,
          decStr,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.66),
          "monospace",
          "bold",
          "#ffffff"
        );

        // Row 4: DMS Coordinates
        rowY += rowStep;
        drawFittedLine(
          ctx,
          dmsStr,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.62),
          "monospace",
          "normal",
          "#e2e8f0"
        );

        // Row 5: Altitude, Accuracy & Map Info
        rowY += rowStep;
        drawFittedLine(
          ctx,
          `Alt: ${altText}  |  Acc: ${accText}  |  Map: ${TILE_SERVERS[state.mapLayer].name} (Z${zoom})`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.62),
          "monospace",
          "normal",
          "#cbd5e1"
        );

        // Row 6: Day of Week + Date + Local & UTC Timestamps
        rowY += rowStep;
        drawFittedLine(
          ctx,
          `📅 ${localFormatted}  |  UTC: ${utcFormatted}`,
          textX,
          rowY,
          maxTextWidth,
          Math.round(rowStep * 0.58),
          "monospace",
          "bold",
          "#38bdf8"
        );
      }

      // 5. Save JPEG and Log Entry
      const dataUrl = canvas.toDataURL("image/jpeg", 0.92);
      const safePrefix = state.mode === "project"
        ? plotId.replace(/[^a-zA-Z0-9_-]/g, "_")
        : "FieldCam";
      const filename = `${safePrefix}_${dayName.slice(0, 3)}_${now.toISOString().slice(0, 19).replace(/[:T]/g, "-")}.jpg`;

      const record = {
        id: state.captures.length + 1,
        mode: state.mode,
        plotId,
        project,
        lulcClass,
        placeName,
        dayOfWeek: dayName,
        lat: state.lat,
        lon: state.lon,
        altitude: state.altitude,
        accuracy: state.accuracy,
        timestampISO: now.toISOString(),
        notes,
        filename,
        dataUrl
      };

      state.captures.unshift(record);
      document.getElementById("capture-count").textContent = state.captures.length;
      renderGallery();

      if (state.mode === "project") {
        const nextPlot = autoIncrementPlotId(plotId);
        document.getElementById("input-plot").value = nextPlot;
        syncHudLabels();
      }
    });

    /**************************************************************
     * 10. UI DRAWERS, HUD SYNC & GIS EXPORTS (CSV / GEOJSON)
     **************************************************************/
    function syncHudLabels() {
      if (state.mode === "project") {
        document.getElementById("hud-plot").textContent =
          document.getElementById("input-plot").value;
        document.getElementById("hud-class").textContent =
          document.getElementById("input-class").value;
        document.getElementById("hud-notes").textContent =
          "Notes: " + document.getElementById("input-notes").value;
      } else {
        document.getElementById("hud-plot").textContent = "FieldCam v1";
        document.getElementById("hud-class").textContent = "Geo-Stamp Preset";
      }
      document.getElementById("hud-place").textContent =
        "📍 " + getActivePlaceName();
    }

    document.getElementById("btn-open-meta").addEventListener("click", () => {
      if (state.mode !== "project") return;
      document.getElementById("drawer-meta").classList.add("open");
    });

    document.getElementById("btn-close-meta").addEventListener("click", () => {
      syncHudLabels();
      document.getElementById("drawer-meta").classList.remove("open");
    });

    document.getElementById("btn-open-gallery").addEventListener("click", () => {
      document.getElementById("drawer-gallery").classList.add("open");
    });

    document.getElementById("btn-close-gallery").addEventListener("click", () => {
      document.getElementById("drawer-gallery").classList.remove("open");
    });

    function renderGallery() {
      const container = document.getElementById("gallery-container");
      container.innerHTML = state.captures
        .map(
          (item) => `
        <div class="photo-card">
          <img src="${item.dataUrl}" alt="${item.plotId}" />
          <div class="photo-card-footer">
            <div>
              <strong>${item.mode === "project" ? item.plotId : "Default Preset"}</strong> (${item.dayOfWeek})<br/>
              <span style="color:#fde68a;font-size:11px;">${item.placeName}</span><br/>
              <span style="color:#94a3b8;font-size:10.5px;">
                ${item.lat ? item.lat.toFixed(5) + ", " + item.lon.toFixed(5) : "No GPS"}
              </span>
            </div>
            <a href="${item.dataUrl}" download="${item.filename}">Save JPG</a>
          </div>
        </div>
      `
        )
        .join("");
    }

    // Export CSV for QGIS / Python
    document.getElementById("btn-export-csv").addEventListener("click", () => {
      if (!state.captures.length) return alert("No field validation points captured yet.");
      const headers = [
        "id",
        "mode",
        "plot_id",
        "project",
        "validation_class",
        "place_name",
        "day_of_week",
        "latitude",
        "longitude",
        "altitude_m",
        "gps_accuracy_m",
        "timestamp_utc",
        "notes",
        "image_filename"
      ];
      const rows = state.captures.map((c) =>
        [
          c.id,
          `"${c.mode}"`,
          `"${c.plotId}"`,
          `"${c.project}"`,
          `"${c.lulcClass}"`,
          `"${(c.placeName || "").replace(/"/g, '""')}"`,
          `"${c.dayOfWeek}"`,
          c.lat ?? "",
          c.lon ?? "",
          c.altitude ?? "",
          c.accuracy ?? "",
          c.timestampISO,
          `"${(c.notes || "").replace(/"/g, '""')}"`,
          `"${c.filename}"`
        ].join(",")
      );
      const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows].join("\n");
      const link = document.createElement("a");
      link.href = encodeURI(csvContent);
      link.download = `FieldCam_v1_log_${new Date().toISOString().slice(0, 10)}.csv`;
      link.click();
    });

    // Export GeoJSON for QGIS / GEE
    document.getElementById("btn-export-geojson").addEventListener("click", () => {
      if (!state.captures.length) return alert("No field validation points captured yet.");
      const geojson = {
        type: "FeatureCollection",
        features: state.captures
          .filter((c) => c.lat !== null && c.lon !== null)
          .map((c) => ({
            type: "Feature",
            geometry: {
              type: "Point",
              coordinates: [c.lon, c.lat, c.altitude || 0]
            },
            properties: {
              id: c.id,
              mode: c.mode,
              plot_id: c.plotId,
              project: c.project,
              validation_class: c.lulcClass,
              place_name: c.placeName,
              day_of_week: c.dayOfWeek,
              gps_accuracy_m: c.accuracy,
              timestamp_utc: c.timestampISO,
              notes: c.notes,
              image_filename: c.filename
            }
          }))
      };
      const blob = new Blob([JSON.stringify(geojson, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `FieldCam_v1_${new Date().toISOString().slice(0, 10)}.geojson`;
      link.click();
    });

    // Boot Application
    window.addEventListener("DOMContentLoaded", () => {
      updateLiveClock();
      syncHudLabels();
      initCamera();
      initGeolocation();
    });
  </script>
</body>
